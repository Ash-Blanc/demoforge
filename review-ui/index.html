<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DemoForge — Review Console</title>
<style>
  :root {
    --bg: #0a0a0c; --panel: #101014; --panel-raised: #16161c;
    --border: rgba(255,255,255,.06);
    --text: #fafafa; --dim: #71717a;
    --accent: #22d3ee; --accent-dim: rgba(34,211,238,.1);
    --green: #34d399; --red: #f87171;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px;
    min-height: 100vh; padding: 32px clamp(16px, 4vw, 48px);
    -webkit-font-smoothing: antialiased;
  }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: .2em; }
  .logo .glyph { color: var(--accent); margin-right: 10px; }
  .logo em { font-style: normal; color: var(--dim); letter-spacing: .35em; font-size: 11px; margin-left: 12px; }
  .sub { color: var(--dim); font-size: 12px; margin: 6px 0 24px; }
  .stage {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--accent); background: var(--accent-dim);
    padding: 5px 12px; border-radius: 99px; margin-bottom: 20px;
  }
  .stage::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25);
  }
  .panel h2 {
    font-size: 10px; color: var(--dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: .14em; margin-bottom: 14px;
  }
  .shot {
    padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.025);
    border-left: 2px solid var(--accent); font-size: 12.5px; margin-bottom: 8px; line-height: 1.55;
  }
  .shot .title { font-weight: 600; }
  .shot .meta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .cut { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: rgba(255,255,255,.02); margin-bottom: 12px; }
  .cut h3 { font-size: 13px; margin-bottom: 8px; }
  .cut video { width: 100%; border-radius: 8px; background: #000; min-height: 160px; }
  .cut .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
  .cut .meta { color: var(--dim); font-size: 11.5px; }
  .buttons { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    padding: 11px 16px; border: none; border-radius: 10px; font-family: inherit;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: transform 160ms var(--ease-out), background 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .btn-approve { background: var(--green); color: #052e1b; }
  .btn-deny { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,.35); }
  .btn-render { background: var(--accent); color: #04212b; width: 100%; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .btn-deny:hover { background: rgba(248,113,113,.08); }
  }
  .empty { color: var(--dim); font-size: 12.5px; }
  .empty code { background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 5px; }
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel-raised); border: 1px solid rgba(34,211,238,.35);
    border-radius: 18px; padding: 32px; max-width: 460px; width: calc(100% - 32px);
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .modal .tag { font-size: 10px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .22em; }
  .modal .action { font-size: 15px; margin: 14px 0 6px; line-height: 1.6; }
  .modal .reason { color: var(--dim); font-size: 12.5px; line-height: 1.6; margin-bottom: 20px; }
  .modal .buttons { display: flex; gap: 10px; }
  .modal .buttons .btn { flex: 1; }
  .stagger-item { opacity: 0; transform: translateY(8px); }
</style>
</head>
<body>
  <div class="logo stagger-item"><span class="glyph">▣</span>DEMOFORGE<em>REVIEW CONSOLE</em></div>
  <div class="sub stagger-item">The director agent films your repo. Nothing renders or publishes without your sign-off.</div>
  <div class="stage stagger-item" id="stage">idle — waiting for the director</div>

  <main class="grid">
    <section class="panel stagger-item">
      <h2>Shot List</h2>
      <div id="shots" class="empty">No plan yet — run the director.</div>
    </section>
    <section class="panel stagger-item">
      <h2>Rough Cuts</h2>
      <div id="cuts" class="empty">No rough cuts yet.</div>
      <div id="finalRow"></div>
    </section>
  </main>

  <div class="modal-overlay" id="gateModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="tag">Approval Required</div>
      <div class="action" id="gateAction" style="font-size:15px;margin:14px 0 4px;line-height:1.6"></div>
      <div class="reason" id="gateReason" style="color:var(--dim);font-size:12.5px;margin-bottom:20px"></div>
      <div class="buttons">
        <button class="btn btn-approve" id="gateYes">Approve</button>
        <button class="btn btn-deny" id="gateDeny">Deny</button>
      </div>
    </div>
  </div>

<script src="./app.js"></script>
</body>
</html>
